<!DOCTYPE html>
<html>

<head>

    <title>Login - RheumaCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🌿
        </div>

        <h1>RheumaCare</h1>

        <p class="subtitle">
            Rheumatoid Arthritis Support Platform
        </p>

        <h2>Welcome Back</h2>

        <p class="small-text">
            Login to continue to your dashboard
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </p>

    </div>

</div>

</body>

</html>
