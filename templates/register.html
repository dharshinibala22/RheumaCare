<!DOCTYPE html>
<html>

<head>

    <title>Register - RheumaCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🌿
        </div>

        <h1>RheumaCare</h1>

        <p class="subtitle">
            Create your account
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p class="register-text">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</div>

</body>

</html>
